<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebOS Educativo</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Boot Screen -->
    <div id="boot-screen" class="boot-screen">
        <div class="boot-content">
            <div class="boot-logo">💻</div>
            <h1 class="boot-title">WebOS Educativo</h1>
            <p class="boot-subtitle">Il tuo primo computer virtuale</p>
            <div class="boot-progress">
                <div class="boot-progress-bar" id="boot-progress-bar"></div>
            </div>
            <div id="profile-select" class="profile-select" style="display:none;">
                <p>Chi sei?</p>
                <div class="profile-buttons">
                    <button class="profile-btn" data-profile="bambino" onclick="app.selectProfile('bambino')">
                        <span class="profile-icon">👦</span>
                        <span>Bambino</span>
                    </button>
                    <button class="profile-btn" data-profile="adulto" onclick="app.selectProfile('adulto')">
                        <span class="profile-icon">👤</span>
                        <span>Adulto</span>
                    </button>
                    <button class="profile-btn" data-profile="anziano" onclick="app.selectProfile('anziano')">
                        <span class="profile-icon">👴</span>
                        <span>Anziano</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Desktop -->
    <div id="desktop" class="desktop hidden">
        <div id="desktop-icons" class="desktop-icons"></div>
        <div id="window-container" class="window-container"></div>
        <div id="clock-widget" class="clock-widget hidden" onclick="app.toggleCalendarWidget()">
            <div class="clock-widget-time" id="clock-widget-time"></div>
            <div class="clock-widget-date" id="clock-widget-date"></div>
            <div class="clock-widget-calendar hidden" id="clock-widget-calendar"></div>
        </div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" class="taskbar hidden">
        <button id="start-btn" class="start-btn" onclick="app.toggleStartMenu()">
            <span class="start-icon">🪟</span>
            <span class="start-text">Menu</span>
        </button>
        <div id="taskbar-apps" class="taskbar-apps"></div>
        <div class="taskbar-right">
            <button class="notification-bell" id="notification-bell" onclick="app.toggleNotificationCenter()" title="Notifiche">
                🔔
                <span class="notification-badge hidden" id="notification-badge">0</span>
            </button>
            <button class="notification-bell" id="search-btn" onclick="app.openLauncher()" title="Cerca">
                🔍
            </button>
            <span id="taskbar-clock" class="taskbar-clock"></span>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="start-menu hidden">
        <div class="start-menu-header">
            <span id="start-menu-user" class="start-menu-user">👤 Utente</span>
        </div>
        <div class="start-menu-items" id="start-menu-items">
            <button class="start-menu-item" onclick="app.openApp('file-manager')">
                <span class="start-menu-icon">📁</span>
                <span>File e cartelle</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('browser')">
                <span class="start-menu-icon">🌐</span>
                <span>Internet</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('tutor')">
                <span class="start-menu-icon">🤖</span>
                <span>Tutor AI</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('guide')">
                <span class="start-menu-icon">📖</span>
                <span>Guida</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('settings')">
                <span class="start-menu-icon">⚙️</span>
                <span>Impostazioni</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('games')">
                <span class="start-menu-icon">🎮</span>
                <span>Giochi</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('calculator')">
                <span class="start-menu-icon">🧮</span>
                <span>Calcolatrice</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('notepad')">
                <span class="start-menu-icon">📝</span>
                <span>Blocco Note</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('terminal')">
                <span class="start-menu-icon">💻</span>
                <span>Terminale</span>
            </button>
            <button class="start-menu-item" onclick="app.openApp('task-manager')">
                <span class="start-menu-icon">📊</span>
                <span>Task Manager</span>
            </button>
            <div class="start-menu-separator"></div>
            <button class="start-menu-item start-menu-item-danger" onclick="app.shutdown()">
                <span class="start-menu-icon">🔌</span>
                <span>Spegni</span>
            </button>
        </div>
    </div>

    <!-- Shutdown Screen -->
    <div id="shutdown-screen" class="shutdown-screen hidden">
        <div class="shutdown-content">
            <div class="shutdown-icon">💤</div>
            <p class="shutdown-text">Arrivederci!</p>
            <button class="shutdown-btn" onclick="app.wakeUp()">Riaccendi</button>
        </div>
    </div>

    <!-- Tutor Bubble (floating contextual help) -->
    <div id="tutor-bubble" class="tutor-bubble hidden">
        <div class="tutor-bubble-content" id="tutor-bubble-content"></div>
        <button class="tutor-bubble-close" onclick="app.hideTutorBubble()">✕</button>
    </div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>

    <!-- Notification Center -->
    <div id="notification-center" class="notification-center">
        <div class="notification-center-header">
            <span class="notification-center-title">🔔 Notifiche</span>
            <button class="notification-center-clear" onclick="app.clearAllNotifications()">Cancella tutto</button>
        </div>
        <div class="notification-list" id="notification-list"></div>
    </div>

    <!-- Global Launcher -->
    <div id="launcher-overlay" class="launcher-overlay" onclick="if(event.target===this)app.closeLauncher()">
        <div class="launcher-panel">
            <div class="launcher-input-wrapper">
                <span class="launcher-icon">🔍</span>
                <input type="text" class="launcher-input" id="launcher-input" placeholder="Cerca app, file, impostazioni..."
                       oninput="app.handleLauncherInput(this.value)" onkeydown="app.handleLauncherKeydown(event)">
            </div>
            <div class="launcher-categories" id="launcher-categories">
                <button class="launcher-category-btn active" data-cat="all" onclick="app.setLauncherCategory('all')">Tutto</button>
                <button class="launcher-category-btn" data-cat="apps" onclick="app.setLauncherCategory('apps')">App</button>
                <button class="launcher-category-btn" data-cat="files" onclick="app.setLauncherCategory('files')">File</button>
                <button class="launcher-category-btn" data-cat="settings" onclick="app.setLauncherCategory('settings')">Impostazioni</button>
            </div>
            <div class="launcher-results" id="launcher-results"></div>
        </div>
    </div>

    <!-- Voice button -->
    <button id="voice-btn" class="voice-btn hidden" onclick="app.toggleVoice()" title="Ascolta">
        🔊
    </button>

    <script src="js/ai/tutor.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
