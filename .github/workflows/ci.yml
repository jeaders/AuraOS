name: AuraOS Real Distro CI

on:
  push:
    branches: [ real-distro ]
  pull_request:
    branches: [ real-distro ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: node --check desktop/js/app.js
      - run: node --check main.js
      - run: node --check preload.js
      - run: python3 -c "import json; json.load(open('package.json')); print('package.json OK')"
      - run: python3 -c "import json; json.load(open('desktop/manifest.json')); print('manifest OK')"
      - run: python3 -c "from html.parser import HTMLParser; f=open('desktop/index.html'); HTMLParser().feed(f.read()); print('HTML OK')"
      - run: bash -n distro/build.sh
      - run: bash -n distro/scripts/install.sh
      - run: bash -n distro/scripts/post-install.sh
      - run: bash -n distro/scripts/live.sh
      - run: test -f distro/kernel/config && echo "kernel config OK"
      - run: test -f distro/boot/grub/grub.cfg && echo "grub config OK"
      - run: test -f distro/packages/base.list && echo "package list OK"

  build-iso:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debootstrap \
            squashfs-tools \
            genisoimage \
            grub-pc-bin \
            grub-efi-amd64-bin \
            xorriso \
            qemu-system-x86 \
            qemu-utils \
            dosfstools \
            parted \
            mtools
      - name: Build AuraOS ISO
        run: |
          chmod +x distro/build.sh
          sudo ./distro/build.sh
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraOS-1.0-amd64
          path: |
            AuraOS-1.0-amd64.iso
            AuraOS-1.0-amd64.iso.sha256
          retention-days: 30
