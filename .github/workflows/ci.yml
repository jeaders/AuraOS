name: AuraOS CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: npm install
      - run: node --check desktop/js/app.js
      - run: node --check main.js
      - run: node --check preload.js
      - run: python3 -c "import json; json.load(open('desktop/manifest.json')); print('manifest OK')"
      - run: python3 -c "import json; json.load(open('package.json')); print('package OK')"
      - run: python3 -c "from html.parser import HTMLParser; f=open('desktop/index.html'); HTMLParser().feed(f.read()); print('HTML OK')"
      - run: bash -n scripts/build-all.sh
      - run: bash -n scripts/build-kernel.sh
      - run: bash -n scripts/build-rootfs.sh
      - run: bash -n scripts/build-iso.sh
      - run: bash -n scripts/setup-dev.sh
      - run: test -f kernel/config && echo "kernel config OK"
      - run: test -f boot/grub/grub.cfg && echo "grub config OK"
      - run: test -f rootfs/etc/passwd && echo "rootfs passwd OK"

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '18'
      - run: sudo apt-get update
      - run: sudo apt-get install -y debootstrap squashfs-tools genisoimage grub-pc-bin grub-efi-amd64-bin xorriso qemu-system-x86
      - run: chmod +x scripts/*.sh
      - run: ./scripts/build-all.sh
      - uses: actions/upload-artifact@v3
        with:
          name: AuraOS-ISO
          path: AuraOS-1.0.iso
          retention-days: 30
