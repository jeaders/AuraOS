# AuraOS GRUB Configuration for Real Distro

set timeout=5
set default=0

# Theme
set theme="/boot/grub/theme/auraos.txt"
set gfxmode=auto
insmod gfxterm
insmod png
insmod gfxmenu

# Load modules
insmod part_msdos
insmod ext2
insmod iso9660
insmod loopback

# AuraOS entry
menuentry "AuraOS" --class auraos --class gnu-linux --class gnu --class os {
    recordfail
    load_video
    set gfxpayload=keep
    linux /live/vmlinuz boot=live quiet splash live-media-path=/live
    initrd /live/initrd.img
}

menuentry "AuraOS (Safe Mode)" --class auraos --class gnu-linux --class gnu --class os {
    recordfail
    load_video
    set gfxpayload=keep
    linux /live/vmlinuz boot=live nomodeset live-media-path=/live
    initrd /live/initrd.img
}

menuentry "AuraOS (Text Mode)" --class auraos --class gnu-linux --class gnu --class os {
    recordfail
    load_video
    set gfxpayload=keep
    linux /live/vmlinuz boot=live text live-media-path=/live
    initrd /live/initrd.img
}

menuentry "System Setup" {
    fwsetup
}
